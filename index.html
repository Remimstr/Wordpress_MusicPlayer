<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Remi Marchand — Composer</title>

  <link rel="stylesheet" href="player.css">
</head>

<body>

  <main>
    <section id="composer-player" class="composer-player">
      <div class="composer-tracklist" aria-label="Music"></div>
    </section>
  </main>

  <div class="composer-floating-player" aria-label="Music player">

    <div class="composer-player-inner">

      <div class="composer-player-transport">

        <button
          class="composer-player-button composer-player-prev"
          type="button"
          aria-label="Previous track"
        >
          <img src="icons/skip-back.svg" alt="">
        </button>

        <button
          class="composer-player-button composer-player-play"
          type="button"
          aria-label="Play"
        >
          <img src="icons/play.svg" alt="">
        </button>

        <button
          class="composer-player-button composer-player-next"
          type="button"
          aria-label="Next track"
        >
          <img src="icons/skip-forward.svg" alt="">
        </button>

      </div>

      <div class="composer-player-main">

        <div class="composer-player-heading">
          <span class="composer-player-title">Flidais' Grove</span>
          <span class="composer-player-separator">·</span>
          <span class="composer-player-style">Ambient · Orchestral</span>
        </div>

        <div class="composer-player-progress-row">

          <div class="composer-floating-progress">
            <input
              class="composer-progress"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Seek through track"
            >
          </div>

          <div class="composer-player-time">
            <span class="composer-current-time">0:00</span>
            <span class="composer-time-separator">/</span>
            <span class="composer-duration">0:00</span>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="player.js"></script>

</body>
</html>
